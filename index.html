<form action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">

  <label for="name">Full Name</label>
  <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter your full name"
    required
  >

  <label for="phone">Phone Number</label>
  <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="Enter your phone number"
    required
  >

  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email address"
    required
  >

  <label for="address">Pickup Address</label>
  <input
    type="text"
    id="address"
    name="address"
    placeholder="Enter the pickup address"
    required
  >

  <label for="message">Additional Information</label>
  <textarea
    id="message"
    name="message"
    rows="4"
    placeholder="Please include the appliance type, make and model (if known), pickup address, preferred pickup date and time, whether the item is inside or outside, if stairs are involved, and any other details that will help us prepare for the pickup."
  ></textarea>

  <button type="submit">Submit Pickup Request</button>

</form>
