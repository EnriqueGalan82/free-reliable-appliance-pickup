
<section id="pickup-request">
  <h2>Schedule a Free Appliance Pickup</h2>

  <form action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">

    <label for="name">Full Name</label>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="Enter your full name"
      required
    >

    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="Enter your phone number"
      required
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email address"
      required
    >

    <label for="address">Pickup Address</label>
    <input
      type="text"
      id="address"
      name="address"
      placeholder="Enter the pickup address"
      required
    >

    <label for="city">City</label>
    <input
      type="text"
      id="city"
      name="city"
      placeholder="Enter your city"
      required
    >

    <label for="zip">ZIP Code</label>
    <input
      type="text"
      id="zip"
      name="zip"
      placeholder="Enter your ZIP code"
      required
    >

    <label for="appliance">Appliance Type</label>
    <select id="appliance" name="appliance" required>
      <option value="">Select an appliance</option>
      <option>Refrigerator</option>
      <option>Freezer</option>
      <option>Washer</option>
      <option>Dryer</option>
      <option>Dishwasher</option>
      <option>Oven / Range</option>
      <option>Microwave</option>
      <option>Water Heater</option>
      <option>Air Conditioner</option>
      <option>Other</option>
    </select>

    <label for="pickup-date">Preferred Pickup Date</label>
    <input
      type="date"
      id="pickup-date"
      name="pickup_date"
    >

    <label for="pickup-time">Preferred Pickup Time</label>
    <input
      type="time"
      id="pickup-time"
      name="pickup_time"
    >

    <label for="message">Additional Information</label>
    <textarea
      id="message"
      name="message"
      rows="5"
      placeholder="Please include the appliance make and model (if known), condition, whether it is inside or outside, if stairs are involved, gate or access codes, preferred pickup date and time, and any other details that will help us complete your pickup safely and efficiently."
    ></textarea>

    <button type="submit">Submit Pickup Request</button>

  </form>
</section>
